<!DOCTYPE html>
<html lang="uk">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Lab8_4</title>
	<link rel="stylesheet" href="style.css">
</head>
<body>

	<main class="cards-container">
		<h1 class="page-title">Картки</h1>

		<div class="cards-grid">
			
			<article class="card card--featured">
				<div class="card__image-wrap">
					<img class="card__img" src="images/1.png" alt=">:)">
				</div>
				<div class="card__content">
					<h2 class="card__title">1 Завдання</h2>
					<p class="card__text">
						Це був дуже цікавий початок. 
					</p>
					<a href="#" class="card__btn">Ось чому</a>
				</div>
			</article>

			<article class="card">
				<div class="card__image-wrap">
					<img class="card__img" src="images/2.png" alt=">:(">
				</div>
				<div class="card__content">
					<h2 class="card__title">2 Завдання</h2>
					<p class="card__text">
						grid-column-start: 5;
					</p>
					<a href="#" class="card__btn">>:)</a>
				</div>
			</article>

			<article class="card">
				<div class="card__image-wrap">
					<img class="card__img" src="images/3.png" alt="Пупупу">
				</div>
				<div class="card__content">
					<h2 class="card__title">3 Завдання</h2>
					<p class="card__text">
						Тут я познайомився з end
					</p>
					<a href="#" class="card__btn">Подивитись</a>
				</div>
			</article>

			<article class="card">
				<div class="card__image-wrap">
					<img class="card__img" src="images/4.png" alt=">:(">
				</div>
				<div class="card__content">
					<h2 class="card__title">4 Завдання</h2>
					<p class="card__text">
						Оказується, старт може бути не 1 а 2
					</p>
					<a href="#" class="card__btn">TELL ME MORE!!!</a>
				</div>
			</article>

			<article class="card">
				<div class="card__image-wrap">
					<img class="card__img" src="images/5.png" alt=">:(">
				</div>
				<div class="card__content">
					<h2 class="card__title">Завдання 5</h2>
					<p class="card__text">
						end та start можуть бути від'ємні...
					</p>
					<a href="#" class="card__btn">Та ти що</a>
				</div>
			</article>

		</div>
	</main>

</body>
</html>
