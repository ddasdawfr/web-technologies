<!DOCTYPE html>
<html lang="uk">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
	<meta http-equiv="X-UA-Compatible" content="ie=edge">
	<title>Lab6_5</title>
	<link rel="stylesheet" href="style.css">
</head>
<body>


	<div class="weather-widget">
		
		<div class="controls-box">
			<img src="arrow-left.png" alt="arrow-right" class="nav-icon">
			<img src="arrow-right.png" alt="arrow-right" class="nav-icon">
		</div>

		<div class="main-card">
			<div class="temp-large">17</div>
		</div>

		<div class="cloud-graphic">
			<img src="cloud.png" alt="cloud" class="nav-icon">
		</div>

		<div class="forecast-card">
			<div class="forecast-item">
				<span class="day">Mon</span>
				<span class="temp">17&deg;</span>
			</div>
			<div class="forecast-item">
				<span class="day">Tue</span>
				<span class="temp">19&deg;</span>
			</div>
			<div class="forecast-item">
				<span class="day">Wed</span>
				<span class="temp">16&deg;</span>
			</div>
			<div class="forecast-item">
				<span class="day">Thu</span>
				<span class="temp">18&deg;</span>
			</div>
			<div class="forecast-item">
				<span class="day">Fri</span>
				<span class="temp">21&deg;</span>
			</div>
		</div>

	</div>

</body>
</html>
